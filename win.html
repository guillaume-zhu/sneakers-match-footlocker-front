<!doctype html>
<html lang="fr-FR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sneakers Match - Foot Locker</title>
    <meta
      name="description"
      content="Jouez au Sneakers Match, le jeu de mémoire de Foot Locker. Associez les paires de sneakers pour tenter de gagner des récompenses exclusives !"
    />
    <link rel="stylesheet" href="./src/styles/reset.css" />
    <link rel="stylesheet" href="./src/styles/main.css" />
    <link rel="shortcut icon" href="./src/assets/images/favicon.png" type="image/png" />
  </head>

  <body>
    <!-- HEADER -->
    <header>
      <div>
        <img src="./src/assets/images/foot-locker-logo.png" alt="Logo" />
        <img src="./src/assets/images/foot-locker-logo.png" alt="Logo" />
        <img src="./src/assets/images/foot-locker-logo.png" alt="Logo" />
        <img src="./src/assets/images/foot-locker-logo.png" alt="Logo" />
        <img src="./src/assets/images/foot-locker-logo.png" alt="Logo" />
        <img src="./src/assets/images/foot-locker-logo.png" alt="Logo" />
        <img src="./src/assets/images/foot-locker-logo.png" alt="Logo" />
        <img src="./src/assets/images/foot-locker-logo.png" alt="Logo" />
        <img src="./src/assets/images/foot-locker-logo.png" alt="Logo" />
        <img src="./src/assets/images/foot-locker-logo.png" alt="Logo" />
        <img src="./src/assets/images/foot-locker-logo.png" alt="Logo" />
        <img src="./src/assets/images/foot-locker-logo.png" alt="Logo" />
        <img src="./src/assets/images/foot-locker-logo.png" alt="Logo" />
        <img src="./src/assets/images/foot-locker-logo.png" alt="Logo" />
        <img src="./src/assets/images/foot-locker-logo.png" alt="Logo" />
      </div>
    </header>

    <!-- MAIN -->
    <main>
      <div class="container win">
        <div class="win-contenus">
          <p>Sneakers Match</p>

          <div class="win-cards">
            <img src="./src/assets/images/win-card.png" alt="gain" />
            <img src="./src/assets/images/win-card.png" alt="gain" />
            <img src="./src/assets/images/win-card.png" alt="gain" />
          </div>

          <h2>Merci d'avoir joué ! Vous avez gagné :</br><span>20€ en bon d'achat</span></h2>

          <p>Vous recevrez les instructions </br>pour le récupérer par mail</p>
        </div>
      </div>
    </main>

    <!-- FOOTER -->
    <footer>
      <nav>
        <ul>
          <li><a href="#">mentions légales</a></li>
          <li>© 2026 Foot locker Tous droits réservés</li>
          <li><a href="#">conditions générales</a></li>
        </ul>
      </nav>
    </footer>

    <!-- Élements absolute sur le bg -->
    <img
      class="fin-jeu-black-bars win-black-bars"
      src="./src/assets/images/black-bars.png"
      alt="barres noires foot-locker"
    />
    <img
      class="fin-jeu-gradient-bar win-gradient-bar"
      src="./src/assets/images/gradient-bar-fin-jeu.png"
      alt="barre dégradé"
    />

    <img
      class="win-fluid"
      src="./src/assets/images/fluid-3-win.svg"
      alt="barre dégradé"
    />
